[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "ad-tabfusion"
version = "2.0.0"
description = "Longitudinal multimodal clinical tables predict future CN/MCI/AD state with strict temporal validation, calibration, and uncertainty reporting."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "WRicd"},
]
requires-python = ">=3.11"
# Lower bounds are the oldest releases without a known advisory (pip-audit).
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.5.0",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
    "joblib>=1.3",
    "pytest>=9.0.3",
    "streamlit>=1.54.0",
]

[project.optional-dependencies]
gpu = [
    "xgboost>=2.0",
    "lightgbm>=4.6.0",
    # src/models/deep_tabular.py imports torch, which was never declared.
    "torch>=2.11.0",
]
tracking = [
    "mlflow>=3.14.0",
    "optuna>=3.5",
]
explain = [
    "shap>=0.44",
]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest-cov>=5.0",
    "tqdm>=4.66.3",
]
all = [
    "ad-tabfusion[gpu,tracking,explain,dev]",
]

[tool.setuptools.packages.find]
include = ["src*", "dashboard*", "scripts*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.css", "*.md", "*.png", "*.joblib", "*.csv", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = ["ignore::UserWarning"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# F (pyflakes) catches real defects and is enforced. The cosmetic rulesets are
# scoped to what the existing Phase A-D code already satisfies, so CI stays
# meaningful instead of failing on pre-existing style.
select = ["F", "I", "UP", "W"]
ignore = [
    "UP035",  # deprecated typing imports; the codebase targets 3.11+ gradually
]

[tool.ruff.lint.per-file-ignores]
# Scripts bootstrap sys.path before importing src, so imports cannot come first.
"scripts/*" = ["E402", "I001", "F841"]
"tests/*" = ["E402"]
# These modules import matplotlib inside functions after setting MPLCONFIGDIR.
# The ordering is load-bearing -- sorting the block would import matplotlib
# before the backend is configured.
"src/phase_d/calibration.py" = ["I001"]
"src/phase_d/discrete_time.py" = ["I001"]
"src/phase_d/selective_prediction.py" = ["I001"]
"src/phase_d/transition_model.py" = ["I001"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "scripts/*"]
