project:
  name: AD-TabFusion
  seed_list: [42, 43, 44, 45, 46]
  output_dir: outputs
  tracking:
    enabled: true
    experiment_name: AD-TabFusion
    # tracking_uri: "http://localhost:5000"  # uncomment for remote MLflow server

data:
  raw_csv: data/raw/TADPOLE_D1_D2.csv
  subject_col: RID
  visit_col: VISCODE
  label_col: DX
  task: diagnosis_multiclass
  use_baseline_only: false

split:
  test_size: 0.20
  val_size: 0.10

preprocessing:
  numeric_impute: median
  categorical_impute: most_frequent
  max_missing_rate: 0.60

models:
  run:
    - logistic_regression
    - random_forest
  use_gpu: false
  logistic_regression:
    C: 1.0
    max_iter: 2000
    class_weight: balanced
  random_forest:
    n_estimators: 300
    max_depth: null
    class_weight: balanced
  xgboost:
    n_estimators: 200
    learning_rate: 0.05
    max_depth: 3
    early_stopping: false
    use_gpu: false
    verbosity: 0
  lightgbm:
    n_estimators: 200
    learning_rate: 0.05
    early_stopping: false
    use_gpu: false
    verbosity: -1

evaluation:
  metrics:
    - accuracy
    - balanced_accuracy
    - macro_f1
    - roc_auc_ovr
    - cohen_kappa

explainability:
  run_shap: true
  max_samples: 300
